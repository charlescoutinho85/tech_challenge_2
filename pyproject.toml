[project]
name = "tech-challenge-2"
version = "0.1.0"
description = ""
authors = [
    {name = "Charles Albano",email = "charlescoutinho85@gmail.com"}
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas (>=2.3,<3.0)",
    "torch (>=2.13.0,<3.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "mlflow (>=3.14.0,<4.0.0)",
    "dvc (>=3.67.1,<4.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "fastapi (>=0.115,<1.0)",
    "uvicorn (>=0.34,<1.0)"
]


[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
torch = { source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.22,<0.16.0)",
    "pre-commit (>=4.6.1,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []