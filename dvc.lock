schema: '2.0'
stages:
  preprocess:
    cmd: poetry run python -c "from src.data.preprocessors import 
      MovieLensPreprocessor; import pandas as pd; df = 
      pd.read_csv('data/raw/ratings.csv'); 
      MovieLensPreprocessor().process(df).to_csv('data/processed/clean.csv', 
      index=False)"
